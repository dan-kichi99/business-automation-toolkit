[project]
name = "business-automation-toolkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "openpyxl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
